configSpecVersion: '3.0'
name: erp-eu
author: 'gematik GmbH'
description: 'Validation Module for the Specification "Elektronische Rezept - Erweiterung für die Europäische Union (ePA-EU)"'
version: '${project.version}' # follows the maven version
specUrl: 'https://simplifier.net/packages/de.gematik.erezept.eu/1.1.2'
errorOnUnknownProfile: "true"
anyExtensionsAllowed: "false"

ignoredCodeSystems:
- "http://fhir.de/CodeSystem/ifa/pzn"
- "http://fhir.de/CodeSystem/bfarm/atc"

ignoredValueSets:
- "http://hl7.org/fhir/uv/ips/ValueSet/medicine-doseform" # requires expansion

globalSuppressionRules:

messageTransformations:

packageGroups:
  erp-eu.1.1.2:
    packages:
    - "de.gematik.erezept.eu#1.1.2"
    - "kbv.all.st#1.34.0"
    - "hl7.fhir.uv.xver-r5.r4#0.0.1-snapshot-2"
    - "hl7.terminology.r4#7.1.0"

profileFamilies:
  group-id:
    canonicalBase: "https://gematik.de/fhir/erp-eu/StructureDefinition"
    defaultVersion: "1.1"
    versions:
      # Define a "catch all" version
      "1.1":
        groups:
          - packageGroupName: erp-eu.1.1.2
      "1.1.2":
        groups:
          - packageGroupName: erp-eu.1.1.2